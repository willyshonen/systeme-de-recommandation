name: CI/CD — MEL Recommender

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/mel-recommender-api

jobs:

  # ── 1. Tests ─────────────────────────────────────────────────────────────
  test:
    name: Tests & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt -r requirements-api.txt pytest pytest-cov httpx

      - name: Linting (ruff)
        run: |
          pip install ruff
          ruff check src/ api/ tests/ --ignore E501

      - name: Tests unitaires
        run: pytest tests/ -v --cov=api --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
        continue-on-error: true

  # ── 2. Build Docker ───────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Smoke test sur l'image Docker ─────────────────────────────────────
  smoke-test:
    name: Smoke Test API
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull & run l'image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker run -d \
            --name mel-api-test \
            -p 8000:8000 \
            -v ${{ github.workspace }}/models:/app/models:ro \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Attendre le démarrage
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:8000/health && break || sleep 3
          done

      - name: Tests /health et /popular
        run: |
          curl -sf http://localhost:8000/health | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert data['status'] == 'ok', f'Status != ok: {data}'
          print('✅ /health OK')
          "
          curl -sf "http://localhost:8000/popular?n=5" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert len(data['popular_products']) == 5
          print('✅ /popular OK')
          "

      - name: Cleanup
        if: always()
        run: docker rm -f mel-api-test || true
