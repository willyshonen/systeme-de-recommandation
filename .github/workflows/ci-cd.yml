name: CI/CD — MEL Recommender

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/mel-recommender-api

jobs:

  # ── 1. Tests & Linting ────────────────────────────────────────────────────
  test:
    name: Tests & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt pytest pytest-cov httpx

      - name: Linting (ruff)
        run: |
          pip install ruff
          ruff check src/ api/ tests/ --ignore E501

      - name: Tests unitaires
        run: pytest tests/ -v --cov=api --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          file: coverage.xml
        continue-on-error: true

  # ── 2. Train + MLflow tracking ────────────────────────────────────────────
  train:
    name: Train & Track (MLflow)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer des modèles factices (données non disponibles en CI)
        run: python scripts/generate_fake_models.py

      - name: Entraîner et logger dans MLflow (tracking local)
        env:
          # Tracking local sur le runner — pas de serveur distant en CI
          MLFLOW_TRACKING_URI: ""
        run: |
          python src/train.py \
            --data-dir data/raw \
            --models-dir models \
            --k-factors 150 \
            --als-factors 32 \
            --als-reg 0.1 \
            --alpha 1.0 \
            --eval-sample 100
        # Note : échoue gracieusement si data/raw/ est vide (pas de vraies données en CI)
        continue-on-error: true

      - name: Afficher les métriques du dernier run MLflow
        run: |
          python - <<'EOF'
          import json, pathlib, sys

          summary = pathlib.Path("models/results_summary.json")
          if not summary.exists():
              print("⚠️  Pas de résultats (données absentes en CI)")
              sys.exit(0)

          data = json.loads(summary.read_text())
          metrics = data.get("metrics", {})
          params  = data.get("hyperparameters", {})

          print("=" * 50)
          print("📊 Résultats d'entraînement MEL Recommender")
          print("=" * 50)
          for k, v in params.items():
              print(f"  {k:25s} = {v}")
          print("-" * 50)
          for k, v in metrics.items():
              print(f"  {k:25s} = {v}")
          print("=" * 50)
          EOF

      - name: Upload artefacts MLflow (runs + résumé)
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-run-${{ github.sha }}
          path: |
            mlruns/
            models/results_summary.json
          retention-days: 30
        if: always()

  # ── 3. Build Docker ───────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: train
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push (sans modèles)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  # ── 4. Smoke test ─────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test API
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer dépendances API
        run: pip install -r requirements.txt tqdm httpx

      - name: Générer des modèles factices
        run: python scripts/generate_fake_models.py

      - name: Démarrer l'API en arrière-plan
        run: |
          python -m uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Test /health
        run: |
          curl -sf http://localhost:8000/health | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert data['status'] == 'ok', f'Status != ok: {data}'
          print('✅ /health OK')
          "

      - name: Test /popular
        run: |
          curl -sf 'http://localhost:8000/popular?n=5' | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert len(data['popular_products']) == 5
          print('✅ /popular OK')
          "
