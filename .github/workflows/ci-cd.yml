name: CI/CD — MEL Recommender

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/mel-recommender-api

jobs:

  # ── 1. Tests ─────────────────────────────────────────────────────────────
  test:
    name: Tests & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt -r requirements-api.txt pytest pytest-cov httpx

      - name: Linting (ruff)
        run: |
          pip install ruff
          ruff check src/ api/ tests/ --ignore E501

      - name: Tests unitaires
        run: pytest tests/ -v --cov=api --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          file: coverage.xml
        continue-on-error: true

  # ── 2. Build Docker ───────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      # Les modèles (.pkl, .npy) sont dans .gitignore → on build sans eux
      # En production ils sont montés comme volume Docker
      - name: Build & Push (sans modèles)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  # ── 3. Smoke test ─────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test API
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer dépendances API
        run: pip install -r requirements-api.txt httpx

      - name: Générer des modèles factices
        run: python scripts/generate_fake_models.py

      - name: Démarrer l'API en arrière-plan
        run: |
          python -m uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Test /health
        run: |
          curl -sf http://localhost:8000/health | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert data['status'] == 'ok', f'Status != ok: {data}'
          print('✅ /health OK')
          "

      - name: Test /popular
        run: |
          curl -sf 'http://localhost:8000/popular?n=5' | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert len(data['popular_products']) == 5
          print('✅ /popular OK')
          "
