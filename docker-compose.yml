services:

  # ── MLflow Tracking Server ─────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.15.0
    container_name: mel-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow-data/mlruns:/mlflow/mlruns
      - ./mlflow-data/artifacts:/mlflow/artifacts
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri /mlflow/mlruns
      --default-artifact-root /mlflow/artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── API FastAPI ────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mel-recommender-api
    ports:
      - "8000:8000"
    volumes:
      # Monte les modèles depuis le host → mis à jour sans rebuild à chaque retrain
      - ./models:/app/models:ro
      # Monte le catalogue produits pour le filtre disponibilité
      - ./data/raw:/app/data/raw:ro
    environment:
      - PYTHONUNBUFFERED=1
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      # Clé secrète pour l'endpoint /reload (changer en production)
      - RELOAD_SECRET=${RELOAD_SECRET:-mel-reload-secret}
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Scheduler (retrain automatique hebdomadaire) ───────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: mel-scheduler
    volumes:
      # Partage data et models avec le trainer pour lire/écrire
      - ./data:/app/data
      - ./models:/app/models
      - ./mlflow-data/mlruns:/mlflow/mlruns
      - ./mlflow-data/artifacts:/mlflow/artifacts
    environment:
      - DATA_DIR=data/raw
      - MODELS_DIR=models
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - API_URL=http://api:8000
      # Clé pour recharger l'API après retrain (doit correspondre à celle de l'API)
      - RELOAD_SECRET=${RELOAD_SECRET:-mel-reload-secret}
      # Planification cron (défaut: dimanche à 2h du matin)
      # Exemples: "0 2 * * 0" = dimanche 2h | "0 3 * * *" = chaque jour 3h
      - RETRAIN_SCHEDULE=${RETRAIN_SCHEDULE:-0 2 * * 0}
      # Mettre à "1" pour lancer un retrain dès le démarrage du container
      - RETRAIN_ON_START=${RETRAIN_ON_START:-0}
      # Connexion MySQL directe (production) — laisser vide en dev
      - MYSQL_HOST=${MYSQL_HOST:-}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DB=${MYSQL_DB:-mel_cameroun}
      - MYSQL_USER=${MYSQL_USER:-mel_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-}
      # Notification webhook Slack/Discord (optionnel)
      - NOTIFY_WEBHOOK=${NOTIFY_WEBHOOK:-}
    depends_on:
      api:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    restart: unless-stopped

  # ── Trainer ponctuel (ré-entraînement manuel) ──────────────────────────────
  trainer:
    build:
      context: .
      dockerfile: Dockerfile.train
    container_name: mel-recommender-trainer
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlflow-data/mlruns:/mlflow/mlruns
      - ./mlflow-data/artifacts:/mlflow/artifacts
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    profiles:
      - train    # activé uniquement avec : docker compose --profile train up trainer
